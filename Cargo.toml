[package]
name = "nexus-cog-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Brain-aware Model Context Protocol server — persistent cortex sessions, multi-agent plasticity, real-time thought replay"
license = "Apache-2.0"
repository = "https://github.com/nexus-cognitive-tech/nexus-cog-mcp"
homepage = "https://github.com/nexus-cognitive-tech"
authors = ["Nexus Cognitive Technologies"]
keywords = ["mcp", "cortex", "agent", "brain", "protocol"]
categories = ["api-bindings", "science"]
readme = "README.md"

[dependencies]
nexus-cog-core = { path = "../nexus-cog-core", version = "0.1.0" }
nexus-cog-storage = { path = "../nexus-cog-storage", version = "0.1.0" }
nexus-cog-neural = { path = "../nexus-cog-neural", version = "0.1.0" }
nexus-cog-commands = { path = "../nexus-cog-commands", version = "0.1.0" }
nexus-cog-causal = { path = "../nexus-cog-causal", version = "0.2.0" }
nexus-cog-patterns = { path = "../nexus-cog-patterns", version = "0.1.0" }
nexus-cog-provenance = { path = "../nexus-cog-provenance", version = "0.2.0" }
nexus-cog-antifragile = { path = "../nexus-cog-antifragile", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "reqwest"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dashmap = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

[[bin]]
name = "nexus-cog-mcp-server"
path = "src/bin/server.rs"

[dev-dependencies]
tempfile = "3"

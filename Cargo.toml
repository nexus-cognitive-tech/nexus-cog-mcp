[package]
name = "nexus-cog-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Brain-aware Model Context Protocol server — persistent cortex sessions, multi-agent plasticity, real-time thought replay"
license = "Apache-2.0"
repository = "https://github.com/nexus-cognitive-tech/nexus-cog-mcp"
homepage = "https://github.com/nexus-cognitive-tech"
authors = ["Nexus Cognitive Technologies"]
keywords = ["mcp", "cortex", "agent", "brain", "protocol"]
categories = ["api-bindings", "science"]
readme = "README.md"

[features]
default = []
http = ["dep:axum", "rmcp/transport-streamable-http-server"]

[dependencies]
nexus-cog-commands = { path = "../nexus-cog-commands", version = "0.1.0" }
rmcp = { version = "2.2", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }

[[bin]]
name = "nexus-cog-mcp-server"
path = "src/bin/server.rs"

[dev-dependencies]
tempfile = "3"
